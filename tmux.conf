set -as terminal-features ',tmux-256color:RGB;clipboard;focus;strikethrough;title;usstyle;overline;ocs7;sync;extkeys;ccolour;cstyle;hyperlinks;ignorefkeys;margins;mouse;osc7;overline;rectfill;sixel'
set -g default-shell '/bin/zsh'
# set -g default-terminal "rxvt-unicode-256color" # "screen-256color"
set -g default-terminal "screen-256color"

# Status
set -g status-interval 2

# Escape time
set-option -sg escape-time 10

# Status right
# set -g status-right '#{uptime} | #{keyboard_layout} | #[fg=green]#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load --colors --powerline-right --interval 2)#[default] | %a %h-%d %H:%M  | #{prefix_highlight}'
