#set -g status-right '#[fg=yellow]Load: #(uptime | awk -F "load average: " "{ print \$2 }" | cut -d "," -f1) #[fg=white]• #[fg=cyan]Battery: #(acpi | awk "{ print \$4 }" | tr -d ",") #[fg=white]• #[fg=green]Time: #(date +"%H:%M:%S") #[fg=white]• #[fg=magenta]Date: #(date +"%Y-%m-%d") #[default]'
set -g status-right '#[fg=yellow]Load: #(uptime | awk -F "load average: " "{ print \$2 }" | cut -d "," -f1) #[fg=white]• #[fg=green]Time: #(date +"%H:%M:%S") #[fg=white]• #[fg=magenta]Date: #(date +"%Y-%m-%d") #[default]'

# Status left
# set -g status-left "#S #[fg=green,bg=black]#(tmux-mem-cpu-load --colors --interval 2)#[default]"
# set -g status-left '#S | #{window_width}x#{window_height} #{tmux_mode_indicator}'
# set -g status-left '#[fg=green]#S #[fg=white]• #[fg=blue]#(hostname -s) #[fg=white]• #[fg=yellow]#(date +"%H:%M:%S") #[fg=white]• #[fg=cyan]#(uptime -p | cut -d " " -f2-) #[default]'
#set -g status-left '#[fg=green]Session: #S #[fg=white]• #[fg=blue]Host: #(hostname -s) #[fg=white]• #[fg=cyan]Uptime: #(uptime -p | cut -d " " -f2-) #[default]'
set -g status-left '#[fg=green]Session: #S #[fg=white]• #[fg=blue]Host: #(hostname -s) #[fg=white]• #[fg=cyan]Uptime: #(uptime -p | cut -d " " -f2-)'
set -g status-left-length 70

# Clock
set -g clock-mode-colour colour5
set -g clock-mode-style 24

# Window
set -g automatic-rename on
set -g automatic-rename-format "#{?window_name,,#{pane_current_command}} "
set -g renumber-windows on
set -g mode-keys vi
#set -g scroll-on-clear on

# Window style
set -g window-status-format " #[fg=#DDD1C7,bg=#8DB580]#I #[fg=red]#W "
set -g window-status-separator " │ "
set -g window-status-activity-style 'bold'
set -g window-style 'bg=#2F2F2F,fg=#FFFFFF'

# Window bell
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
#setw -g window-status-format "#I:🔔 #W"

# Status format
# set -g status-format[0] '#[align=centre]#[fg=white,bg=magenta] Window: #I #[fg=yellow,bg=black] (#W) #[fg=cyan]Panes: #P #[default]'

# Status
set -g status on
set -g status-keys vi
set -g status-interval 2
set -g status-justify centre
set -g status-style 'bg=#3F3F3F,fg=#FFFFFF,us=#4B4A67'

# History
set -g history-file ~/.config/tmux/history

# Focus
set -g focus-events on

# Exit
set -g exit-empty off
set -g detach-on-destroy off

# Editor
set -g editor 'nvim'

# Peripherals & X11
set -g mouse on

# Clipboard
# set -s copy-command 'xclip -selection clipboard -i > /dev/null'
set -s copy-command 'wl-copy -p'

# Enable bi-directional clipboard
set -g set-clipboard on

# Pasting
#set -g assume-paste-time 10

# Page activity
set -g display-panes-active-colour colour3

# Lock
# set -g lock-after-time 0

# Activity
set -g monitor-bell on
set -g monitor-activity off
set -g visual-activity off
set -g visual-bell both
set -g activity-action any

# Bell
set -g bell-action any

# History limit
set -g history-limit 100000

# When C-u is pressed, change the default working directory to the current pane's path
bind-key u attach-session -c '#{pane_current_path}'

# Open links in VS Code
# bind -n M-u run-shell "tmux show-buffer | code -"

# Plugins
# Update environment
set -g update-environment 'DBUS_SESSION_BUS_ADDRESS DISPLAY SSH_AUTH_SOCK XAUTHORITY TMUX TMUX_PLUGIN_MANAGER_PATH TMUX_TMPDIR TMUX_PANE'

# Python path
set -g @python_path "#(pyenv which python)"

