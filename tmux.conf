# Terminal and Shell
set -g default-shell '/bin/zsh'
set -g default-terminal "tmux-256color"

# Better Colors
set -as terminal-features 'tmux-256color:RGB;clipboard;focus;sixel;mouse;sync;title;hyperlinks;overline;ignorefkeys;ccolour;strikethrough'

# Focus
set -g focus-events on

# Status
set -g status on
set -g status-interval 2
set -g status-keys vi
set -g status-justify centre
set -g status-style 'bg=#282c34,fg=#abb2bf'

# Status Right
set -g status-right-length 80
set -g status-right '#[fg=#e5c07b]Load: #(uptime | awk -F "load average: " "{ print \$2 }" | cut -d "," -f1) #[fg=#56b6c2]| #[fg=#98c379]%Y-%m-%d #[fg=#56b6c2]%H:%M:%S'

# Status Left
set -g status-left-length 80
set -g status-left '#[fg=#61afef]Session: #[fg=#98c379]#S #[fg=#56b6c2]| #[fg=#c678dd]Host: #[fg=#98c379]#(hostname -s) #[fg=#56b6c2]| #[fg=#e06c75]Uptime: #[fg=#98c379]#(uptime -p | sed "s/up //")'

# Clock
set -g clock-mode-colour colour5
set -g clock-mode-style 24

# Window style improvements
setw -g window-status-format " #[fg=#abb2bf,bg=#3e4451] #I:#W #[default]"
setw -g window-status-current-format "#[fg=#282c34,bg=#98c379,bold] #I:#W #[default]"
setw -g window-status-separator "|"
setw -g window-status-activity-style 'bold,fg=#e06c75'
setw -g window-style 'bg=#282c34,fg=#abb2bf'

# Pane border style
set -g pane-border-style 'fg=#3e4451'
set -g pane-active-border-style 'fg=#61afef'

# Message style (for commands feedback)
set -g message-style 'bg=#282c34,fg=#e5c07b'

# History and Buffer
set -g history-limit 50000
set -g buffer-limit 100
set -g history-file ~/.config/tmux/history

# Mouse and Clipboard
set -g mouse on
set -g set-clipboard external
set -s copy-command 'wl-copy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe "tee -a '${XDG_DATA_HOME}/tmux/buffer/copy_history' | wl-copy"

# Assume paste time
set -g assume-paste-time 100

# Plugin settings
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'yardnsm/tmux-1password'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'thepante/tmux-git-autofetch'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'robhurring/tmux-uptime'

# Make terminal vim and tmux work better together.
set -g @plugin 'tmux-plugins/vim-tmux-focus-events'

# Prefix Highlight customization
set -g @prefix_highlight_fg '#282c34'
set -g @prefix_highlight_bg '#e5c07b'

# Net speed format
set -g @net_speed_format "#[fg=#98c379]↓ %10s #[fg=#e06c75]↑ %10s"

# Session convenience bindings
bind-key u attach-session -c '#{pane_current_path}'

# Start Plugin Manager
run '~/.tmux/plugins/tpm/tpm'
 
