# Terminal and Shell
set -g default-shell '/bin/zsh'
set -g default-terminal 'tmux-256color'
set -as terminal-features 'tmux-256color:RGB,clipboard,focus,sixel,mouse,sync,title,hyperlinks,strikethrough'
set -g focus-events on
setw -g allow-passthrough on

# Clipboard and history persistence (binary-safe chunks at 4 MiB via script)
set -g history-limit 200000
set -g buffer-limit 5000
set -g history-file '/home/victorqueiroz/.config/tmux/history'
set -g mouse on
set -s set-clipboard on
set -s copy-command '/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh store-clipboard --source copy-mode'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# History controls and "history section" popup
bind-key H display-popup -E -w 85% -h 85% '/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh menu'
bind-key C-s run-shell -b '/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh save-panes --source manual'
bind-key C-y run-shell -b '/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh import-clipboard --source system'
bind-key C-r run-shell -b '/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh restore-clipboard 1'
bind-key C-x run-shell -b '/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh clear-clipboard'
bind-key C-k run-shell -b '/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh clear-panes'
set-hook -g client-detached 'run-shell -b "/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh save-panes --source client-detached"'
set-hook -g pane-exited 'run-shell -b "/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh save-panes --source pane-exited"'
run-shell -b '/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh pane-daemon-start 120'

# Catppuccin Mocha (dark, standardized palette)
set -g status on
set -g status-interval 5
set -g status-keys vi
set -g status-justify centre
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 120
set -g status-left '#[fg=#89b4fa,bold] #S #[fg=#6c7086]|#[fg=#a6e3a1] #(hostname -s) #[fg=#6c7086]|#[fg=#cba6f7] Hist <prefix>+H '
set -g status-right-length 140
set -g status-right '#[fg=#94e2d5]clip:#(/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh count clipboard) #[fg=#6c7086]| #[fg=#89dceb]pane:#(/home/victorqueiroz/.config/tmux/scripts/tmux-history.sh count panes) #[fg=#6c7086]| #[fg=#f9e2af]%Y-%m-%d #[fg=#89b4fa]%H:%M:%S'

setw -g window-status-format '#[fg=#bac2de,bg=#313244] #I:#W #[default]'
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #[default]'
setw -g window-status-separator ''
setw -g window-status-activity-style 'bold,fg=#f38ba8,bg=#313244'
setw -g window-style 'bg=#1e1e2e,fg=#cdd6f4'
setw -g window-active-style 'bg=#1e1e2e,fg=#cdd6f4'

set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#313244,fg=#f9e2af'
set -g mode-style 'bg=#313244,fg=#89b4fa'
set -g clock-mode-style 24

# Assume paste time
set -g assume-paste-time 100

# Plugin settings
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'yardnsm/tmux-1password'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'thepante/tmux-git-autofetch'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'robhurring/tmux-uptime'
set -g @plugin 'tmux-plugins/vim-tmux-focus-events'

# Plugin colors
set -g @prefix_highlight_fg '#1e1e2e'
set -g @prefix_highlight_bg '#f9e2af'
set -g @net_speed_format '#[fg=#a6e3a1]↓ %10s #[fg=#f38ba8]↑ %10s'

# Session convenience bindings
bind-key u attach-session -c '#{pane_current_path}'

# Start Plugin Manager
run '/home/victorqueiroz/.config/tmux/plugins/tpm/tpm'
 
